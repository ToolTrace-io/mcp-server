# Smithery deploys this repo as a hosted remote server.
# The container speaks Streamable HTTP on /mcp; each caller presents their own
# ToolTrace API key as a bearer token, so there is no shared credential here.
runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
  target: http
startCommand:
  type: http
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: ToolTrace API key
        description: Your ToolTrace API key. Get one free at https://tooltrace.io/signup
    required:
      - apiKey
  # Sent as a header, never a query parameter: a key in a URL lands in proxy
  # access logs, browser history and referrers. X-ToolTrace-Key rather than
  # Authorization so the raw key works without a "Bearer " prefix.
  exampleConfig:
    apiKey: tt_live_your_key_here
